version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ailearnmate-postgres
    environment:
      POSTGRES_USER: ailearnmate
      POSTGRES_PASSWORD: ailearnmate_pass
      POSTGRES_DB: ailearnmate
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailearnmate"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: ailearnmate-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ailearnmate
      MONGO_INITDB_ROOT_PASSWORD: ailearnmate_pass
      MONGO_INITDB_DATABASE: ailearnmate
    volumes:
      - mongodb_data:/data/db
      - ./database/mongodb_schema.js:/docker-entrypoint-initdb.d/01-schema.js
      - ./database/mongodb_seed_data.js:/docker-entrypoint-initdb.d/02-seed.js
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ailearnmate --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: ailearnmate-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: ailearnmate-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ailearnmate-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ailearnmate
      - POSTGRES_PASSWORD=ailearnmate_pass
      - POSTGRES_DB=ailearnmate
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USER=ailearnmate
      - MONGODB_PASSWORD=ailearnmate_pass
      - MONGODB_DB=ailearnmate
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ailearnmate-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - POSTGRES_HOST=postgres
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
      - STORAGE_ENDPOINT=http://minio:9000
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
      - mongodb
      - minio

  # Celery Flower (Monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ailearnmate-flower
    command: celery -A app.workers.celery_app flower --port=5555
    environment:
      - REDIS_HOST=redis
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ailearnmate-frontend
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  minio_data:

networks:
  default:
    name: ailearnmate-network
